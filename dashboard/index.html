<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudAdmin AI - Offboarding Audit</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f5f6f8;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

.cards {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    min-width: 150px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

.card strong {
    display: block;
    font-size: 28px;
    margin-top: 8px;
}

table {
    width: 100%;
    background: white;
    border-collapse: collapse;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #eee;
}

.success {
    color: green;
    font-weight: bold;
}

.failed {
    color: red;
    font-weight: bold;
}

.warning {
    color: darkorange;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>CloudAdmin AI</h1>
<div class="subtitle">Microsoft 365 Offboarding Audit Dashboard</div>

<div class="cards">
    <div class="card">
        Total
        <strong id="total">0</strong>
    </div>

    <div class="card">
        Success
        <strong id="success">0</strong>
    </div>

    <div class="card">
        Failed
        <strong id="failed">0</strong>
    </div>
</div>

<table>
<thead>
<tr>
    <th>Date</th>
    <th>User</th>
    <th>UPN</th>
    <th>Status</th>
</tr>
</thead>

<tbody id="records">
</tbody>
</table>

<script>

async function loadRecords() {

    /*
      The dashboard expects a generated records.json file
      in this directory.
    */

    try {

        const response = await fetch("records.json");
        const data = await response.json();

        document.getElementById("total").textContent = data.length;

        document.getElementById("success").textContent =
            data.filter(x => x.finalStatus === "SUCCESS").length;

        document.getElementById("failed").textContent =
            data.filter(x =>
                x.finalStatus === "FAILED" ||
                x.finalStatus === "FAILED_VERIFICATION"
            ).length;

        const table = document.getElementById("records");

        data.forEach(record => {

            const row = document.createElement("tr");

            let statusClass = "warning";

            if (record.finalStatus === "SUCCESS")
                statusClass = "success";

            if (
                record.finalStatus === "FAILED" ||
                record.finalStatus === "FAILED_VERIFICATION"
            )
                statusClass = "failed";

            row.innerHTML = `
                <td>${record.timestamp || ""}</td>
                <td>${record.displayName || ""}</td>
                <td>${record.userPrincipalName || ""}</td>
                <td class="${statusClass}">
                    ${record.finalStatus || ""}
                </td>
            `;

            table.appendChild(row);
        });

    } catch (error) {

        console.error(error);

        document.getElementById("records").innerHTML =
            "<tr><td colspan='4'>No audit records available.</td></tr>";
    }
}

loadRecords();

</script>

</body>
</html>
